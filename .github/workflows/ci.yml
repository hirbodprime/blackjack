name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      APP_ENV: test
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-never-used-in-production
      TELEGRAM_TEST_BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test game tests -v 1
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m compileall -q blackjack.py bot_sections game tests
