<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telegram Roulette</title>
  <style>
    body { margin:0; padding:0; overflow:hidden; }
  </style>
  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <!-- Telegram Game SDK -->
  <script async src="https://telegram.org/js/telegram-game.js"></script>
</head>
<body>
  <script>
    // ==== 2.1: POCKET MAPPING ====
    // Real European roulette wheel order (0 at top, then clockwise)
    const POCKETS = [
      0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,
      8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,
      28,12,35,3,26
    ];
    const RED_SET   = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

    // ==== 2.2: Phaser Config ====
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: '#1a1a1a',
      scene: {
        preload,
        create
      }
    };
    const game = new Phaser.Game(config);

    function preload() {
      this.load.image('wheel', 'assets/wheel.png');
      this.load.image('pin',   'assets/pin.png');
      this.load.spritesheet('spinBtn', 'assets/spin_button.png', { frameWidth: 200, frameHeight: 80 });
    }

    function create() {
      // center wheel
      const wheel = this.add.image(400, 300, 'wheel').setScale(0.8);
      // pin at top
      this.add.image(400, 80, 'pin').setScale(0.5);

      // SPIN button
      const btn = this.add.image(400, 550, 'spinBtn', 0).setInteractive();
      btn.on('pointerdown', () => btn.setFrame(1));
      btn.on('pointerup', () => {
        btn.setFrame(0);
        spinWheel.call(this, wheel);
      });

      // TelegramGameSetup
      TelegramGameSetup({
        onInit: () => console.log('Game initialized'),
        onButtonClick: () => {
          // no-op: we trigger spin on our own UI
        }
      });
    }

    // ==== 2.3: Spin Logic ====
    function spinWheel(wheel) {
      // random full rotations + random pocket offset
      const rounds = Phaser.Math.Between(3, 5);
      const pocketIndex = Phaser.Math.Between(0, 36);
      // each pocket is 360/37 degrees
      const anglePerPocket = 360 / 37;
      const finalAngle = rounds * 360 + pocketIndex * anglePerPocket;

      this.tweens.add({
        targets: wheel,
        angle: finalAngle,
        ease: 'Cubic.easeOut',
        duration: 5000,
        onComplete: () => {
          const landed = POCKETS[pocketIndex];
          const color = landed === 0
            ? 'green'
            : (RED_SET.has(landed) ? 'red' : 'black');

          // report score = landed number
          window.TelegramGameProxy.setScore(landed, true);

          // optionally show result overlay
          const style = { font: '48px Arial', fill: '#fff', backgroundColor:'#000a' };
          this.add.text(400, 300,
            `🎲 ${landed} (${color})`,
            style
          ).setOrigin(0.5);
        }
      });
    }
  </script>
</body>
</html>
